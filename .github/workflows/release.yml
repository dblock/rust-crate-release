name: Release

on:
  workflow_call:
    inputs:
      tool-ref:
        description: Reviewed rust-crate-release ref matching the reusable workflow ref
        required: true
        type: string
      version:
        description: Optional explicit stable crate version
        required: false
        default: ''
        type: string
      config:
        description: Optional rcr.toml path
        required: false
        default: ''
        type: string
    outputs:
      version:
        description: Released crate version
        value: ${{ jobs.release.outputs.version }}
      verification:
        description: JSON verification result
        value: ${{ jobs.release.outputs.verification }}

permissions:
  contents: write
  id-token: write

concurrency:
  group: rcr-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Crate
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.release.outputs.version }}
      verification: ${{ steps.release.outputs.verification }}
    steps:
      - name: Check Out Consumer
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          path: consumer
      - name: Check Out Release Tool
        uses: actions/checkout@v7.0.1
        with:
          repository: dblock/rust-crate-release
          ref: ${{ inputs.tool-ref }}
          path: tool
          persist-credentials: false
      - name: Configure Release Identity
        working-directory: consumer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release
        id: release
        uses: ./tool
        with:
          root: consumer
          config: ${{ inputs.config }}
          version: ${{ inputs.version }}
