name: Release

on:
  workflow_call:
    inputs:
      toolchain:
        description: Rust toolchain for tool and project, at least 1.99.1
        required: false
        default: '1.99.1'
        type: string
      setup-command:
        description: Optional trusted dependency/tool setup command as JSON argv
        required: false
        default: ''
        type: string
      git-user-name:
        description: Release commit author name
        required: false
        default: 'github-actions[bot]'
        type: string
      git-user-email:
        description: Release commit author email
        required: false
        default: '41898282+github-actions[bot]@users.noreply.github.com'
        type: string
      validate-command:
        description: Optional replacement validation command as JSON argv
        required: false
        default: ''
        type: string
      prepare-command:
        description: Optional trusted preparation edit command as JSON argv
        required: false
        default: ''
        type: string
      test-command:
        description: Optional additional source/development test command as JSON argv
        required: false
        default: ''
        type: string
      publish-command:
        description: Optional exact-archive publisher as JSON argv
        required: false
        default: ''
        type: string
      bump-command:
        description: Optional trusted development edit command as JSON argv
        required: false
        default: ''
        type: string
      tool-ref:
        description: Reviewed rust-crate-release ref matching the reusable workflow ref
        required: true
        type: string
      version:
        description: Optional explicit stable crate version
        required: false
        default: ''
        type: string
      config:
        description: Optional rcr.toml path
        required: false
        default: ''
        type: string
      runner:
        description: Optional trusted project runner as JSON argv
        required: false
        default: ''
        type: string
      success-command:
        description: Optional terminal success callback as JSON argv
        required: false
        default: ''
        type: string
      failure-command:
        description: Optional terminal failure callback as JSON argv
        required: false
        default: ''
        type: string
    outputs:
      version:
        description: Released crate version
        value: ${{ jobs.release.outputs.version }}
      verification:
        description: JSON verification result
        value: ${{ jobs.release.outputs.verification }}

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: rcr-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Crate
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.release.outputs.version }}
      verification: ${{ steps.release.outputs.verification }}
    steps:
      - name: Check Out Consumer
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          path: consumer
      - name: Check Out Release Tool
        uses: actions/checkout@v7.0.1
        with:
          repository: dblock/rust-crate-release
          ref: ${{ inputs.tool-ref }}
          path: tool
          persist-credentials: false
      - name: Configure Release Identity
        working-directory: consumer
        env:
          RCR_GIT_USER_NAME: ${{ inputs.git-user-name }}
          RCR_GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        run: |
          git config user.name "$RCR_GIT_USER_NAME"
          git config user.email "$RCR_GIT_USER_EMAIL"
      - name: Release
        id: release
        uses: ./tool
        with:
          root: consumer
          toolchain: ${{ inputs.toolchain }}
          setup-command: ${{ inputs.setup-command }}
          validate-command: ${{ inputs.validate-command }}
          prepare-command: ${{ inputs.prepare-command }}
          test-command: ${{ inputs.test-command }}
          publish-command: ${{ inputs.publish-command }}
          bump-command: ${{ inputs.bump-command }}
          config: ${{ inputs.config }}
          version: ${{ inputs.version }}
          runner: ${{ inputs.runner }}
          success-command: ${{ inputs.success-command }}
          failure-command: ${{ inputs.failure-command }}
