name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit stable release version
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  release:
    name: Publish Crate
    uses: ./.github/workflows/release.yml
    with:
      tool-ref: ${{ github.sha }}
      version: ${{ inputs.version }}
      runner: '["cargo","run","--locked","--quiet","-p","xtask","--bin","rcr-release","--"]'
