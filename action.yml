name: Rust Crate Release
description: Validate, preserve, publish, and reconcile an exact Cargo release archive
author: dblock
branding:
  icon: package
  color: orange
inputs:
  root:
    description: Cargo project checkout path
    default: .
  config:
    description: Optional rcr.toml path relative to the project root
    default: ''
  version:
    description: Optional explicit stable release version
    default: ''
  runner:
    description: Optional trusted project runner as JSON argv
    default: ''
  success-command:
    description: Optional terminal success callback as JSON argv
    default: ''
  failure-command:
    description: Optional terminal failure callback as JSON argv
    default: ''
outputs:
  name:
    description: Released crate name
    value: ${{ steps.release.outputs.name }}
  version:
    description: Released crate version
    value: ${{ steps.release.outputs.version }}
  archive:
    description: Retained exact crate archive
    value: ${{ steps.release.outputs.archive }}
  checksum:
    description: Released archive SHA-256
    value: ${{ steps.release.outputs.checksum }}
  verification:
    description: JSON verification result
    value: ${{ steps.release.outputs.verification }}
runs:
  using: composite
  steps:
    - name: Set Up Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: '1.99.1'
    - name: Install Release Tool
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: '1.99.1'
      run: cargo install --locked --path "$GITHUB_ACTION_PATH" --root "$RUNNER_TEMP/rcr-tool"
    - name: Guard Release and Locate Diagnostics
      id: paths
      shell: bash
      env:
        RCR_ROOT: ${{ inputs.root }}
        RCR_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        RUSTUP_TOOLCHAIN: '1.99.1'
      run: '"$RUNNER_TEMP/rcr-tool/bin/rcr" --root "$RCR_ROOT" actions guard'
    - name: Prepare Release
      id: prepare
      shell: bash
      env:
        RCR_ROOT: ${{ inputs.root }}
        RCR_CONFIG: ${{ inputs.config }}
        RCR_RUNNER: ${{ inputs.runner }}
        RCR_VERSION: ${{ inputs.version }}
        RCR_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        RUSTUP_TOOLCHAIN: '1.99.1'
      run: '"$RUNNER_TEMP/rcr-tool/bin/rcr" --root "$RCR_ROOT" actions prepare'
    - name: Preserve Exact Release
      id: preserve
      uses: actions/upload-artifact@v7.0.2
      with:
        name: rcr-release-${{ github.run_id }}-${{ github.run_attempt }}
        include-hidden-files: true
        if-no-files-found: error
        compression-level: 0
        path: |
          ${{ steps.prepare.outputs.archive }}
          ${{ steps.prepare.outputs.bundle }}
          ${{ steps.paths.outputs.directory }}/source-inputs.json
          ${{ steps.paths.outputs.directory }}/release.json
          ${{ steps.paths.outputs.directory }}/execution.json
    - name: Verify Preservation and Run Release
      id: release
      shell: bash
      env:
        RCR_ROOT: ${{ inputs.root }}
        RCR_CONFIG: ${{ inputs.config }}
        RCR_RUNNER: ${{ inputs.runner }}
        RCR_ARTIFACT_ID: ${{ steps.preserve.outputs.artifact-id }}
        RCR_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GITHUB_TOKEN: ${{ github.token }}
        RUSTUP_TOOLCHAIN: '1.99.1'
      run: '"$RUNNER_TEMP/rcr-tool/bin/rcr" --root "$RCR_ROOT" actions release'
    - name: Retain Final Diagnostics
      if: always() && steps.paths.outputs.directory != ''
      uses: actions/upload-artifact@v7.0.2
      with:
        name: rcr-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        include-hidden-files: true
        if-no-files-found: warn
        path: |
          ${{ steps.paths.outputs.directory }}/*.crate
          ${{ steps.paths.outputs.directory }}/*.bundle
          ${{ steps.paths.outputs.directory }}/release.json
          ${{ steps.paths.outputs.directory }}/execution.json
    - name: Notify Release Result
      if: always()
      shell: bash
      env:
        RCR_ROOT: ${{ inputs.root }}
        RCR_CONFIG: ${{ inputs.config }}
        RCR_STATUS: ${{ job.status }}
        RCR_STEPS: ${{ toJSON(steps) }}
        RCR_SUCCESS_COMMAND: ${{ inputs.success-command }}
        RCR_FAILURE_COMMAND: ${{ inputs.failure-command }}
      run: |
        tool="$RUNNER_TEMP/rcr-tool/bin/rcr"
        if [[ -x "$tool" ]]; then
          "$tool" --root "$RCR_ROOT" actions notify
        elif [[ "$RCR_STATUS" != success && -n "$RCR_FAILURE_COMMAND" ]]; then
          argv_file="$RUNNER_TEMP/rcr-failure-argv"
          printf '%s' "$RCR_FAILURE_COMMAND" | jq -je 'if type == "array" and length > 0 and all(.[]; type == "string") and .[0] != "" then .[] | ., "\u0000" else error("failure callback must be JSON argv") end' > "$argv_file"
          mapfile -d '' -t argv < "$argv_file"
          rm -- "$argv_file"
          RCR_EXECUTION_CONTEXT="$(jq -cn --argjson steps "$RCR_STEPS" '{current_step:null,history:[],workflow:[],run:{platform:"github",run_id:env.GITHUB_RUN_ID,repository:env.GITHUB_REPOSITORY,attempt:env.GITHUB_RUN_ATTEMPT,reference:env.GITHUB_REF,sha:env.GITHUB_SHA,job:env.GITHUB_JOB,workflow_name:env.GITHUB_WORKFLOW,event:env.GITHUB_EVENT_NAME,external_steps:($steps|to_entries|map({id:.key,outcome:.value.outcome,conclusion:.value.conclusion}))}}')"
          export RCR_EXECUTION_CONTEXT
          cd "$RCR_ROOT"
          "${argv[@]}"
        fi
          ${{ steps.paths.outputs.directory }}/source-inputs.json
