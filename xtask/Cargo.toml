[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
default-run = "xtask"

[dependencies]
rust-crate-release = { path = ".." }
regex = "1.13.1"
flate2 = "1.1.11"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
yaml-rust2 = "0.13.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "operations"
harness = false

[lints]
workspace = true
