[package]
name = "rust-crate-release"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Composable release workflows for Rust crates"
license = "MIT"
repository = "https://github.com/dblock/rust-crate-release"
homepage = "https://github.com/dblock/rust-crate-release"
documentation = "https://docs.rs/rust-crate-release"
readme = "README.md"
keywords = ["cargo", "release", "workflow", "changelog", "github-actions"]
categories = ["development-tools"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/DESIGN.md",
    "/CONTRIBUTING.md",
    "/AGENTS.md",
    "/RELEASING.md",
    "/docs/**",
]

[workspace]
members = ["xtask"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
flate2 = "1.1.11"
tar = "0.4.46"
tempfile = "3.27.0"
toml_edit = "0.25.19"
sha2 = "0.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
globset = "0.4.21"
dunce = "1.0.5"
