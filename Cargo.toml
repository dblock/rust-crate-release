[package]
name = "rust-crate-release"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Composable release workflows for Rust crates"
license = "MIT"
repository = "https://github.com/dblock/rust-crate-release"
homepage = "https://github.com/dblock/rust-crate-release"
documentation = "https://docs.rs/rust-crate-release"
readme = "README.md"
keywords = ["cargo", "release", "workflow", "changelog", "github-actions"]
categories = ["development-tools"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/DESIGN.md",
    "/CONTRIBUTING.md",
    "/AGENTS.md",
    "/RELEASING.md",
]

[workspace]
members = ["xtask"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true
